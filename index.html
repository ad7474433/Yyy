<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Gallery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Global Styles */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            color: white;
        }

        /* Container Settings */
        .image-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll; 
            scroll-snap-type: y mandatory; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }

        /* Image Section Styles */
        .full-image-section {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start; 
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Dark Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
        }

        /* Glassmorphism Text Box */
        .content-box {
            position: absolute;
            bottom: 80px;
            left: 20px;
            right: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease-out;
        }

        .content-box h2 {
            margin: 0 0 5px 0;
            font-weight: 600;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .content-box p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Scroll Indicator Animation */
        .scroll-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            border-bottom: 2px solid white;
            border-right: 2px solid white;
            transform: rotate(45deg);
            animation: bounce 2s infinite;
            opacity: 0.7;
        }

        /* Animations */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) rotate(45deg) translateY(0);}
            40% {transform: translateX(-50%) rotate(45deg) translateY(-10px);}
            60% {transform: translateX(-50%) rotate(45deg) translateY(-5px);}
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="image-container" id="imageContainer">
        </div>

    <script>
        const imageContainer = document.getElementById("imageContainer");
        
        const imageUrls = [
            'https://i.imgur.com/hmAABJ7.jpg',
            'https://i.imgur.com/ZYGvd6q.jpg',
            'https://i.imgur.com/YpxSLD0.jpg',
            'https://i.imgur.com/JSU3t4x.jpg',
            'https://i.imgur.com/rMwqoZP.jpg',
            'https://i.imgur.com/Dpi9Zzv.jpg',
            'https://i.imgur.com/0kpyxuU.jpg',
            'https://i.imgur.com/wGi8uyT.jpg'
        ];
        
        const captions = [
            { title: "System Breach", desc: "Security protocols compromised..." },
            { title: "Hidden Data", desc: "Decrypting files in background..." },
            { title: "Cyber Ghost", desc: "No footprints left behind." },
            { title: "Target Locked", desc: "Acquiring IP address..." }
        ];

        function getRandomImages() {
            const shuffled = [...imageUrls].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 4); 
        }
        
        function createImageSections() {
            const selectedImages = getRandomImages();
            imageContainer.innerHTML = '';
            
            for (let i = 0; i < 4; i++) {
                const section = document.createElement('div');
                section.className = 'full-image-section';
                section.style.backgroundImage = `url('${selectedImages[i]}')`;
                
                const caption = captions[i % captions.length];

                section.innerHTML = `
                    <div class="overlay"></div>
                    <div class="content-box">
                        <h2>${caption.title} #${i+1}</h2>
                        <p>${caption.desc}</p>
                    </div>
                    ${i < 3 ? '<div class="scroll-indicator"></div>' : ''} 
                `;
                
                imageContainer.appendChild(section);
            }
        }
        
        createImageSections();
        
        // --- রিডাইরেক্ট লজিক আপডেট করা হয়েছে ---
        let scrollCount = 0;
        let lastScrollTop = 0;
        
        imageContainer.addEventListener('scroll', () => {
            const scrollTop = imageContainer.scrollTop;
            const scrollHeight = imageContainer.scrollHeight;
            const clientHeight = imageContainer.clientHeight;
            
            if (scrollTop > lastScrollTop) {
                // একদম শেষে আসলে রিডাইরেক্ট হবে
                if (scrollTop + clientHeight >= scrollHeight - 50) {
                     console.log("Redirecting to Shopify...");
                     // তোর দেওয়া লিঙ্কে রিডাইরেক্ট হবে
                     window.location.href = "https://www.shopify.com/ppc/online-store?term=shopify&adid=566143522046&campaignid=15433369425&branded_enterprise=1&BOID=brand&utm_medium=cpc&utm_source=google&gad_source=1&gad_campaignid=15433369425&gbraid=0AAAAAC3QZJpApLSRfHnHEXRsnPxLvfARU&gclid=CjwKCAiAxc_JBhA2EiwAFVs7XAPE-n5wworn3iGtLrFBQPyqV2Fm0eHk4QY6MdeUN4Mzp3xR93V-4xoChDQQAvD_BwE"; 
                }
            }
            lastScrollTop = scrollTop;
        });
    </script>
</body>
</html>
